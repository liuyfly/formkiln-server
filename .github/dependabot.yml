version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime image must match the Java toolchain version (21). Upgrade both together.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
