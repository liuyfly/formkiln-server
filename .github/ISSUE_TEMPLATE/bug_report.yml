name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal form schema or code snippet that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package versions
      placeholder: "@formkiln/react 0.1.0, formkiln-server 0.1.0"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, Node.js version
