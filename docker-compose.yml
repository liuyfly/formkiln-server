# Local development stack. Do not use these credentials in production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: formkiln
      POSTGRES_USER: formkiln
      POSTGRES_PASSWORD: formkiln
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formkiln -d formkiln"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches all outgoing email. Web UI: http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  server:
    build: .
    profiles: ["app"]
    environment:
      FORMKILN_DB_URL: jdbc:postgresql://postgres:5432/formkiln
      FORMKILN_DB_USERNAME: formkiln
      FORMKILN_DB_PASSWORD: formkiln
      FORMKILN_SERVICE_TOKEN: ${FORMKILN_SERVICE_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
